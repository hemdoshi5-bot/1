<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QUANT SHIELD — ADAPTIVE PATTERN ENGINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg:#040a12;
      --bg-2:#071420;
      --panel:#0c1828;
      --panel-2:#0e1f33;
      --stroke:#1a3558;
      --good:#18f0b5;
      --good-2:#00d9ff;
      --warn:#ffb11a;
      --bad:#ff5d73;
      --text:#edf7ff;
      --muted:#7ea2c7;
      --shadow: rgba(0,0,0,0.55);
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0; padding:0; height:100%; width:100%;
      background: linear-gradient(135deg, #040a12 0%, #081421 100%);
      color:var(--text); font-family:'Inter',sans-serif;
      overflow:hidden;
    }
    body { display:flex; align-items:center; justify-content:center; }
    .app {
      width:min(100%, 520px); height:100%; max-height:100vh;
      background:linear-gradient(180deg, rgba(7,18,31,0.98), rgba(5,11,18,0.98));
      border:1px solid var(--stroke);
      box-shadow:0 35px 80px rgba(0,0,0,0.8);
      position:relative; overflow:hidden;
    }
    .header {
      height:60px; display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; background:rgba(11,21,34,0.9); border-bottom:1px solid rgba(26,53,88,0.7);
    }
    .logo {
      font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:1px;
      background:linear-gradient(90deg, var(--good), var(--good-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      font-size:15px;
    }
    .api-status {
      display:flex; align-items:center; gap:8px; padding:7px 10px;
      border-radius:999px; border:1px solid rgba(24,240,181,0.5); background:rgba(8,18,24,0.9);
      font-size:11px; font-weight:700; color:var(--good); letter-spacing:0.08em; text-transform:uppercase;
    }
    .dot {
      width:10px; height:10px; border-radius:50%; background:#ff4d5d;
      box-shadow:0 0 12px rgba(255,77,93,0.6); animation:pulse 1s infinite;
    }
    .dot.live { background:#19f0b5; box-shadow:0 0 18px rgba(25,240,181,0.9); }
    .dot.retry { background:#ffb11a; box-shadow:0 0 18px rgba(255,177,26,0.9); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }
    .content {
      height:calc(100% - 60px); overflow-y:auto; padding:14px 14px 20px;
    }
    .banner {
      padding:10px 12px; border:1px solid rgba(25,240,181,0.35); border-radius:12px;
      background:rgba(10,31,31,0.45); color:var(--good); font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; text-align:center;
      margin-bottom:12px;
    }
    .card {
      background:linear-gradient(180deg, rgba(14,25,37,1), rgba(9,16,24,1)); border:1px solid var(--stroke);
      border-radius:18px; padding:16px 14px 12px; box-shadow:inset 0 0 28px rgba(0,0,0,0.28);
    }
    .period {
      text-align:center; font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
      color:var(--warn); margin-bottom:10px; font-weight:800;
    }
    .label {
      text-align:center; margin-bottom:6px; letter-spacing:0.18em; font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase;
    }
    .prediction {
      font-size:60px; line-height:1; margin:0 auto 8px; text-align:center;
      font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:1px; text-shadow:0 0 24px rgba(255,255,255,0.12);
      transition:all .2s ease;
    }
    .prediction.big { color:#ffca3a; text-shadow:0 0 28px rgba(255,202,58,0.65); }
    .prediction.small { color:#44d6ff; text-shadow:0 0 28px rgba(68,214,255,0.65); }
    .pattern-strip {
      text-align:center; color:var(--good); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;
      min-height:16px; margin:4px 0 8px;
    }
    .trend {
      text-align:center; color:var(--good-2); font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px;
    }
    .confidence-bar { height:10px; border-radius:999px; overflow:hidden; background:rgba(6,14,20,0.9); border:1px solid rgba(26,53,88,0.8); }
    .confidence-fill {
      height:100%; width:0%; border-radius:inherit; background:linear-gradient(90deg, #1be6a8, #31d5ff, #2a9dff);
      box-shadow:0 0 16px rgba(49,213,255,0.7); transition:width .25s ease;
    }
    .stats-grid {
      display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:14px;
    }
    .stat-box {
      background:rgba(13,22,31,0.95); border:1px solid rgba(26,53,88,0.8); border-radius:14px; padding:10px 8px; text-align:center;
    }
    .stat-box .mini-label {
      color:var(--muted); text-transform:uppercase; font-size:9px; letter-spacing:0.14em; font-weight:700;
    }
    .stat-box .value {
      margin-top:6px; font-family:'Orbitron',sans-serif; font-weight:800; font-size:17px;
    }
    .small-grid {
      display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:14px;
    }
    .mini-box {
      background:rgba(12,22,33,0.96); border:1px solid rgba(26,53,88,0.8); border-radius:12px; padding:10px 6px; text-align:center;
    }
    .mini-box .mini-label { display:block; color:var(--muted); font-size:8px; letter-spacing:0.16em; text-transform:uppercase; }
    .mini-box .mini-value { margin-top:6px; font-family:'Orbitron',sans-serif; font-weight:800; font-size:15px; }
    .metrics {
      margin-top:14px; background:rgba(10,26,36,0.9); border:1px solid rgba(26,53,88,0.8); border-radius:14px; padding:10px 12px;
    }
    .metric-row {
      display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; font-size:11px; color:var(--muted);
    }
    .metric-row + .metric-row { border-top:1px solid rgba(26,53,88,0.7); }
    .metric-row .metric-value { color:var(--good); font-weight:800; }
    .log-box {
      margin-top:14px; background:#02080d; border:1px solid rgba(26,53,88,0.8); border-radius:12px; padding:10px 12px; height:140px;
      overflow:auto; color:#6b8daf; font-size:10px; line-height:1.6; font-family:'Consolas','monospace';
      box-shadow:inset 0 0 24px rgba(0,0,0,0.55);
    }
    .log-box::-webkit-scrollbar { width:5px; } .log-box::-webkit-scrollbar-thumb { background:#163551; border-radius:999px; }
    .btn {
      width:100%; margin-top:14px; border:none; border-radius:14px; padding:14px 16px; font-size:12px; letter-spacing:0.12em; font-weight:900; text-transform:uppercase;
      cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; color:#04130d; background:linear-gradient(90deg, var(--good), var(--good-2));
      box-shadow:0 12px 24px rgba(20,230,170,0.18);
    }
    .btn:active { transform:translateY(1px) scale(0.995); }
    .win { color:var(--good); }
    .loss { color:var(--bad); }
    .neutral { color:var(--warn); }
    .warning { color:var(--warn); }
    @media (max-width:420px) {
      .prediction { font-size:52px; }
      .header { padding:0 12px; }
      .logo { font-size:13px; }
      .api-status { font-size:10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">QUANT SHIELD</div>
      <div class="api-status"><span id="statusDot" class="dot"></span><span id="statusText">INIT</span></div>
    </div>

    <div class="content">
      <div class="banner">Adaptive pattern fusion • volatility trap guard • anti-loss gate</div>

      <div class="card">
        <div class="period" id="periodDisplay">TARGET • ----</div>
        <div class="label">Prediction Engine</div>
        <div id="predictionDisplay" class="prediction">--</div>
        <div id="patternDisplay" class="pattern-strip">Initializing signal map...</div>
        <div id="trendDisplay" class="trend">Awaiting data</div>
        <div class="confidence-bar"><div id="confidenceFill" class="confidence-fill"></div></div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="mini-label">Win Rate</div><div id="winRate" class="value win">--%</div></div>
        <div class="stat-box"><div class="mini-label">Accuracy</div><div id="accuracy" class="value win">--%</div></div>
        <div class="stat-box"><div class="mini-label">Streak</div><div id="streak" class="value neutral">--</div></div>
      </div>

      <div class="small-grid">
        <div class="mini-box"><span class="mini-label">Wins</span><span id="winsDisplay" class="mini-value win">0</span></div>
        <div class="mini-box"><span class="mini-label">Losses</span><span id="lossesDisplay" class="mini-value loss">0</span></div>
        <div class="mini-box"><span class="mini-label">Conf</span><span id="confDisplay" class="mini-value">0%</span></div>
      </div>

      <div class="metrics">
        <div class="metric-row"><span>Market Phase</span><span id="marketPhase" class="metric-value">INIT</span></div>
        <div class="metric-row"><span>Signal Strength</span><span id="signalStrength" class="metric-value">0%</span></div>
        <div class="metric-row"><span>Pattern Quality</span><span id="patternQuality" class="metric-value">0%</span></div>
        <div class="metric-row"><span>Loss Guard</span><span id="lossGuard" class="metric-value">ON</span></div>
      </div>

      <div class="log-box" id="logConsole"></div>
      <button class="btn" id="resetBtn">Reset & optimize</button>
    </div>
  </div>

<script>
  const clamp = (v,min,max)=>Math.min(max,Math.max(min,v));
  const mean = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : 0;
  const toBit = s => s === 'BIG' ? 1 : 0;
  const opposite = s => s === 'BIG' ? 'SMALL' : 'BIG';

  function logIt(msg,type='info') {
    const box = document.getElementById('logConsole');
    const time = new Date().toLocaleTimeString();
    const cls = type === 'loss' ? 'loss' : type === 'win' ? 'win' : type === 'warn' ? 'warning' : 'neutral';
    box.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  class PatternDetector {
    constructor() {
      this.weights = {
        trend:1.34,
        alternation:1.22,
        streak:1.35,
        reversal:1.18,
        momentum:1.24,
        frequency:1.26,
        repeat2:1.12,
        repeat3:1.16,
        volatility:0.96,
        run:1.28
      };
    }

    detect(history) {
      if (!history || history.length < 4) return {};
      const recent = history.slice(0, 80).map(x => x.size);
      const bits = recent.map(toBit);
      const out = {};

      let cur = 1, best = 1, lastValue = recent[0];
      for (let i=1; i<recent.length; i++) {
        if (recent[i] === lastValue) cur++; else { best = Math.max(best, cur); cur = 1; }
        lastValue = recent[i];
      }
      best = Math.max(best, cur);
      const runSignal = recent[0] || 'BIG';
      const runStrength = clamp((best - 2) / 6, 0, 1);
      out.run = { signal: runStrength > 0.22 ? runSignal : null, strength: runStrength, score: runStrength * this.weights.run };

      let alt = 0;
      for (let i=1; i<Math.min(recent.length, 18); i++) if (recent[i] !== recent[i-1]) alt++;
      const altRatio = recent.length > 1 ? alt / (Math.min(recent.length, 18) - 1 || 1) : 0;
      const altSignal = recent[0] === 'BIG' ? 'SMALL' : 'BIG';
      out.alternation = { signal: altRatio > 0.55 ? altSignal : null, strength: clamp((altRatio - 0.38) / 0.7, 0, 1), score: ((altRatio > 0.55 ? altSignal : null) ? this.weights.alternation * clamp((altRatio - 0.38) / 0.7, 0, 1) : 0) };

      const winSize = Math.min(bits.length, 30);
      const s1 = mean(bits.slice(0, Math.min(8, winSize)));
      const s2 = mean(bits.slice(0, Math.min(18, winSize)));
      const s3 = mean(bits.slice(0, Math.min(30, winSize)));
      const trendBias = s1 + s2*0.5 + s3*0.3;
      const trendDir = trendBias > 0.6 ? 'BIG' : trendBias < 0.4 ? 'SMALL' : null;
      const trendStrength = Math.abs(trendBias - 0.5) * 2.2;
      out.trend = { signal: trendDir, strength: clamp(trendStrength, 0, 1), score: trendDir ? this.weights.trend * clamp(trendStrength, 0, 1) : 0 };

      let reversalHits = 0;
      for (let i=1; i<Math.min(recent.length-1, 24); i++) {
        if (recent[i-1] !== recent[i] && recent[i] !== recent[i+1] && recent[i-1] === recent[i+1]) reversalHits++;
      }
      const revRatio = recent.length > 2 ? reversalHits / (Math.min(recent.length-2, 24) || 1) : 0;
      const revSignal = recent[0] === 'BIG' ? 'SMALL' : 'BIG';
      out.reversal = { signal: revRatio > 0.26 ? revSignal : null, strength: clamp(revRatio / 0.4, 0, 1), score: (revRatio > 0.26 ? this.weights.reversal * clamp(revRatio / 0.4, 0, 1) : 0) };

      const wShort = mean(bits.slice(0, 5));
      const wMid = mean(bits.slice(0, 10));
      const momentumBias = wShort - wMid;
      const momentumSignal = momentumBias > 0 ? 'BIG' : momentumBias < 0 ? 'SMALL' : null;
      const momentumStrength = Math.abs(momentumBias) * 2.5;
      out.momentum = { signal: momentumSignal, strength: clamp(momentumStrength, 0, 1), score: momentumSignal ? this.weights.momentum * clamp(momentumStrength, 0, 1) : 0 };

      const freqBias = mean(bits.slice(0, 18));
      const freqForce = Math.abs(freqBias - 0.5) * 2.2;
      const freqSignal = freqBias > 0.5 ? 'BIG' : 'SMALL';
      out.frequency = { signal: freqForce > 0.12 ? freqSignal : null, strength: clamp(freqForce, 0, 1), score: (freqForce > 0.12 ? this.weights.frequency * clamp(freqForce, 0, 1) : 0) };

      if (recent.length >= 6) {
        const seq2 = recent.slice(0, 2).join('|');
        let seqMatches2 = 0, nextBig2 = 0, nextSmall2 = 0;
        for (let i=2; i<recent.length-1; i++) {
          if (recent.slice(i, i+2).join('|') === seq2) {
            seqMatches2++;
            if (recent[i+1] === 'BIG') nextBig2++; else nextSmall2++;
          }
        }
        const p2 = seqMatches2 > 0 ? nextBig2 / (nextBig2 + nextSmall2 || 1) : 0.5;
        const sig2 = p2 > 0.55 ? 'BIG' : p2 < 0.45 ? 'SMALL' : null;
        const strength2 = Math.abs(p2 - 0.5) * 2.4;
        out.repeat2 = { signal: sig2, strength: clamp(strength2, 0, 1), score: sig2 ? this.weights.repeat2 * clamp(strength2, 0, 1) : 0 };

        const seq3 = recent.slice(0, 3).join('|');
        let seqMatches3 = 0, nextBig3 = 0, nextSmall3 = 0;
        for (let i=3; i<recent.length-1; i++) {
          if (recent.slice(i, i+3).join('|') === seq3) {
            seqMatches3++;
            if (recent[i+2] === 'BIG') nextBig3++; else nextSmall3++;
          }
        }
        const p3 = seqMatches3 > 0 ? nextBig3 / (nextBig3 + nextSmall3 || 1) : 0.5;
        const sig3 = p3 > 0.55 ? 'BIG' : p3 < 0.45 ? 'SMALL' : null;
        const strength3 = Math.abs(p3 - 0.5) * 2.5;
        out.repeat3 = { signal: sig3, strength: clamp(strength3, 0, 1), score: sig3 ? this.weights.repeat3 * clamp(strength3, 0, 1) : 0 };
      }

      let changes = 0;
      for (let i=1; i<Math.min(bits.length, 24); i++) if (bits[i] !== bits[i-1]) changes++;
      const volatility = changes / (Math.min(bits.length, 24) - 1 || 1);
      out.volatility = { signal: volatility > 0.7 ? 'FLIP' : null, strength: clamp(volatility, 0, 1), score: volatility > 0.7 ? this.weights.volatility * clamp(volatility, 0, 1) : 0 };

      return out;
    }

    generateSignal(history, previousPrediction, previousOutcome, consecutiveLosses) {
      if (!history || history.length < 3) return { signal:'BIG', confidence:66 };
      const analysis = this.detect(history);
      const votes = { BIG:0, SMALL:0 };
      const names = Object.keys(analysis);
      names.forEach(name => {
        const item = analysis[name];
        if (!item || !item.signal) return;
        votes[item.signal] += item.score || 0;
      });

      const overallBias = mean(history.slice(0, 18).map(x => x.size === 'BIG' ? 1 : 0));
      const baseSignal = votes.BIG >= votes.SMALL ? 'BIG' : 'SMALL';
      let signal = baseSignal;
      let confidence = 58 + Math.abs(votes.BIG - votes.SMALL) * 4 + Math.abs(overallBias - 0.5) * 30;

      if (analysis.alternation && analysis.alternation.signal) {
        signal = analysis.alternation.signal;
        confidence = Math.max(confidence, 72);
      }

      if (analysis.trend && analysis.trend.signal && analysis.trend.strength > 0.32) {
        signal = analysis.trend.signal;
        confidence = Math.max(confidence, 78);
      }

      if (previousOutcome === 'LOSS' && previousPrediction && previousPrediction === signal) {
        const flipped = opposite(signal);
        signal = flipped;
        confidence = Math.max(confidence, 74);
      }

      if (consecutiveLosses >= 1 && previousPrediction && previousPrediction === signal) {
        signal = opposite(signal);
        confidence = Math.max(confidence, 72);
      }

      if (!names.length || Math.abs(votes.BIG - votes.SMALL) < 0.1) {
        signal = overallBias >= 0.5 ? 'BIG' : 'SMALL';
        confidence = clamp(confidence, 60, 72);
      }

      confidence = clamp(Math.round(confidence), 58, 97);
      return { signal, confidence, analysis };
    }
  }

  class AdaptiveEngine {
    constructor() {
      this.history = [];
      this.predictions = [];
      this.detector = new PatternDetector();
      this.lastPrediction = null;
      this.lastOutcome = null;
      this.consecutiveWins = 0;
      this.consecutiveLosses = 0;
      this.wins = 0;
      this.losses = 0;
      this.marketPhase = 'INITIALIZING';
      this.signalStrength = 0;
      this.patternQuality = 0;
      this.lossGuard = true;
      this.lastPeriod = null;
      this.maxHistory = 300;
    }

    insert(record) {
      if (!record || !record.period) return false;
      if (this.history.length && this.history[0].period === record.period) return false;

      if (this.lastPrediction && this.predictions.length) {
        const prior = this.predictions[this.predictions.length - 1];
        const actual = record.size;
        const hit = prior.signal === actual;

        if (hit) {
          this.wins += 1;
          this.consecutiveWins += 1;
          this.consecutiveLosses = 0;
          this.lastOutcome = 'WIN';
          logIt(`✅ WIN #${this.wins}: predicted ${prior.signal} and market returned ${actual}`, 'win');
        } else {
          this.losses += 1;
          this.consecutiveLosses += 1;
          this.consecutiveWins = 0;
          this.lastOutcome = 'LOSS';
          logIt(`❌ LOSS #${this.losses}: predicted ${prior.signal} but market returned ${actual}`, 'loss');
        }
      }

      this.history.unshift(record);
      if (this.history.length > this.maxHistory) this.history.pop();

      this._updateMarketPhase();
      return true;
    }

    _updateMarketPhase() {
      if (!this.history.length) {
        this.marketPhase = 'INIT';
        this.patternQuality = 0;
        return;
      }
      const recent = this.history.slice(0, 20);
      const bits = recent.map(x => x.size === 'BIG' ? 1 : 0);
      const bigRatio = mean(bits);
      const changes = bits.slice(1).filter((v, i) => v !== bits[i]).length;
      const volatility = changes / Math.max(1, bits.length - 1);

      if (bigRatio > 0.62) this.marketPhase = 'UPTREND';
      else if (bigRatio < 0.38) this.marketPhase = 'DOWNTREND';
      else if (volatility > 0.6) this.marketPhase = 'ALTERNATING';
      else this.marketPhase = 'PATTERNED';

      this.patternQuality = clamp(Math.round((Math.abs(bigRatio - 0.5) * 2 + volatility * 100) / 2), 0, 100);
      this.lossGuard = true;
    }

    computeSignal(period) {
      const next = this.detector.generateSignal(this.history, this.lastPrediction, this.lastOutcome, this.consecutiveLosses);
      const signal = next.signal;
      const confidence = next.confidence;
      this.signalStrength = confidence;
      this.lastPrediction = signal;
      this.lastPeriod = period;
      this.predictions.push({ period, signal, confidence, analysis: next.analysis || {} });
      if (this.predictions.length > this.maxHistory) this.predictions.shift();
      logIt(`🔮 ${signal} • ${confidence}% • target ${period}`, 'info');
      return { signal, confidence }; 
    }

    getStats() {
      const total = this.wins + this.losses;
      const winRate = total ? ((this.wins / total) * 100).toFixed(1) : '--';
      const accuracy = total ? ((this.wins / total) * 100).toFixed(1) : '--';
      const streak = this.consecutiveWins > 0 ? `W${this.consecutiveWins}` : this.consecutiveLosses > 0 ? `L${this.consecutiveLosses}` : '--';
      return { winRate, accuracy, streak, wins:this.wins, losses:this.losses, total };
    }

    reset() {
      this.history = [];
      this.predictions = [];
      this.lastPrediction = null;
      this.lastOutcome = null;
      this.consecutiveWins = 0;
      this.consecutiveLosses = 0;
      this.wins = 0;
      this.losses = 0;
      this.marketPhase = 'INITIALIZING';
      this.signalStrength = 0;
      this.patternQuality = 0;
      this.lossGuard = true;
      this.lastPeriod = null;
      logIt('🔄 Engine reset complete. Fresh pattern scan started.', 'info');
    }
  }

  class NetworkBridge {
    constructor(engine) {
      this.engine = engine;
      this.isPolling = false;
      this.retry = 0;
      this.timeout = 6500;
      this.baseUrls = [
        'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=100&pageNo=1&_t=' + Date.now(),
        'https://bet.8bgame.net/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=100&pageNo=1&_t=' + Date.now(),
        'https://lottery.ubet365.net/api/history/wingo30s?page=1&pageSize=100&_t=' + Date.now(),
        'https://wingo.live/api/lottery/history?game=wingo30&page=1&_t=' + Date.now(),
        'https://api.wingo.zone/history/wingo30s?page=1&limit=100&_t=' + Date.now()
      ];
    }

    async fetchJSON(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), this.timeout);
      try {
        const response = await fetch(url, {
          method:'GET',
          mode:'cors',
          cache:'no-store',
          headers:{'Accept':'application/json,text/javascript,*/*','User-Agent':'Mozilla/5.0'},
          signal:ctrl.signal
        });
        const text = await response.text();
        try { return JSON.parse(text); }
        catch {
          const match = text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
          if (match) {
            try { return JSON.parse(match[0]); } catch (e) {}
          }
          const callback = text.match(/\w+\((\{[\s\S]*\})\)/);
          if (callback && callback[1]) {
            try { return JSON.parse(callback[1]); } catch (e) {}
          }
          return null;
        }
      } finally {
        clearTimeout(timer);
      }
    }

    extractRecords(payload) {
      let candidates = [];
      if (!payload) return [];
      if (Array.isArray(payload)) candidates.push(payload);
      if (payload.data) {
        if (Array.isArray(payload.data.list)) candidates.push(payload.data.list);
        if (Array.isArray(payload.data.records)) candidates.push(payload.data.records);
        if (Array.isArray(payload.data.histories)) candidates.push(payload.data.histories);
      }
      if (Array.isArray(payload.records)) candidates.push(payload.records);
      if (Array.isArray(payload.list)) candidates.push(payload.list);
      if (!candidates.length) {
        for (const key in payload) {
          if (Array.isArray(payload[key])) { candidates.push(payload[key]); break; }
        }
      }

      const out = [];
      const periodKeys = ['issueNumber','issue','periodNumber','period','expect','expectNo','draw_id','id','issueNo','issueNoStr'];
      const numberKeys = ['number','openNumber','result','open','code','value','open_num','result_num','num','open_code','winNumber','last_code','openNumberStr'];

      for (const arr of candidates) {
        for (const item of arr) {
          if (!item) continue;
          let period = null;
          for (const key of periodKeys) {
            if (item[key] != null) { period = String(item[key]); break; }
          }
          let number = null;
          for (const key of numberKeys) {
            if (item[key] != null) {
              let raw = item[key];
              if (Array.isArray(raw)) raw = raw.join('');
              if (typeof raw === 'string') {
                const found = raw.match(/\d+/g);
                raw = found ? found.join('') : raw;
              }
              const parsed = Number(raw);
              if (!Number.isNaN(parsed)) { number = parsed; break; }
            }
          }

          if (period && number != null && !Number.isNaN(number)) {
            const digit = Math.abs(number) % 10;
            out.push({ period: String(period), number: digit, size: digit >= 5 ? 'BIG' : 'SMALL' });
          }
        }
      }

      const unique = new Map();
      for (const row of out) unique.set(row.period, row);
      return Array.from(unique.values()).sort((a,b) => {
        const A = Number(String(a.period).match(/\d+/g)?.join('') || 0);
        const B = Number(String(b.period).match(/\d+/g)?.join('') || 0);
        return B - A;
      });
    }

    async pollOnce() {
      if (this.isPolling) return;
      this.isPolling = true;
      let lastError = null;

      for (const url of this.baseUrls) {
        try {
          const json = await this.fetchJSON(url);
          const records = this.extractRecords(json);
          if (records.length) {
            const newest = records[0];
            this.engine.insert(newest);
            const nextPeriod = (() => {
              try {
                return String(BigInt(String(newest.period).replace(/\D/g, '') || '0') + 1n);
              } catch {
                return String((Number(newest.period) || 0) + 1);
              }
            })();
            const signal = this.engine.computeSignal(nextPeriod);
            this.render(signal, nextPeriod);
            this.setStatus(true);
            this.retry = 0;
            this.isPolling = false;
            return;
          }
        } catch (err) {
          lastError = err;
          logIt(`⚠ API fetch issue: ${err.message || 'network error'}`, 'warn');
        }
      }

      this.retry += 1;
      this.setStatus(false);
      logIt(`⚠ All endpoints failed. Retry ${this.retry}.`, 'warn');
      this.isPolling = false;
      if (lastError) console.warn(lastError);
    }

    render(prediction, period) {
      const stats = this.engine.getStats();
      document.getElementById('periodDisplay').textContent = `TARGET • #${String(period).slice(-8)}`;
      const predEl = document.getElementById('predictionDisplay');
      predEl.textContent = prediction.signal;
      predEl.className = `prediction ${prediction.signal === 'BIG' ? 'big' : 'small'}`;
      document.getElementById('confidenceFill').style.width = `${prediction.confidence}%`;

      const recent = this.engine.history.slice(0, 12).map(x => x.size.charAt(0)).join(' · ') || 'WAITING';
      document.getElementById('patternDisplay').textContent = `◈ ${recent} ◈`;
      document.getElementById('trendDisplay').textContent = this.engine.marketPhase;
      document.getElementById('marketPhase').textContent = this.engine.marketPhase;
      document.getElementById('signalStrength').textContent = `${this.engine.signalStrength}%`;
      document.getElementById('patternQuality').textContent = `${this.engine.patternQuality}%`;
      document.getElementById('lossGuard').textContent = this.engine.consecutiveLosses >= 1 ? 'ACTIVE' : 'ON';
      document.getElementById('winRate').textContent = `${stats.winRate}%`;
      document.getElementById('accuracy').textContent = `${stats.accuracy}%`;
      document.getElementById('winsDisplay').textContent = stats.wins;
      document.getElementById('lossesDisplay').textContent = stats.losses;
      document.getElementById('streak').textContent = stats.streak;
      document.getElementById('confDisplay').textContent = `${prediction.confidence}%`;
      document.getElementById('winRate').className = 'value ' + (Number(stats.winRate) >= 50 ? 'win' : 'neutral');
      document.getElementById('accuracy').className = 'value ' + (Number(stats.accuracy) >= 50 ? 'win' : 'neutral');
    }

    setStatus(isLive) {
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      if (isLive) {
        dot.className = 'dot live';
        txt.textContent = 'LIVE';
        txt.style.color = '#19f0b5';
      } else {
        dot.className = 'dot retry';
        txt.textContent = 'RETRY';
        txt.style.color = '#ffb11a';
      }
    }

    start() {
      this.pollOnce();
      setInterval(() => this.pollOnce(), 2200);
    }
  }

  const engine = new AdaptiveEngine();
  const bridge = new NetworkBridge(engine);

  logIt('⚡ Engine initialize — adaptive pattern detection active.', 'info');
  logIt('🧠 Multi-pattern consensus + anti-repeat safety enabled.', 'info');
  logIt('🌐 API layer ready with fallback endpoints.', 'info');

  document.getElementById('resetBtn').addEventListener('click', () => {
    engine.reset();
    document.getElementById('logConsole').innerHTML = '';
    logIt('🔄 Reset requested. Rebuilding signal memory and re-scanning patterns.', 'info');
    bridge.pollOnce();
  });

  window.addEventListener('load', () => {
    bridge.start();
  });
</script>
</body>
